<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' file: data: blob:; connect-src 'self' file: blob: data:; style-src 'self' 'unsafe-inline'">
  <title>Library</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f1ebe0; --dim: rgba(241,235,224,0.58); --faint: rgba(241,235,224,0.34); --line: rgba(241,235,224,0.14);
      --pane: rgba(20,18,16,0.58); --gold: #d9bf8c;
      --serif: "New York", "Iowan Old Style", ui-serif, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0c0b; color: var(--ink); font: 13px/1.4 var(--sans); user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    body.grab canvas { cursor: grab; } body.grabbing canvas { cursor: grabbing; } body.point canvas { cursor: pointer; }
    .ui { position: absolute; pointer-events: none; }
    .ui > * { pointer-events: auto; }
    #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 95% at 50% 45%, transparent 55%, rgba(0,0,0,0.42) 100%); transition: background 0.9s var(--ease); }
    body.inspect #vignette { background: radial-gradient(90% 85% at 42% 50%, transparent 30%, rgba(0,0,0,0.5) 100%); }

    /* Title and breadcrumb, top left. */
    #crumb { top: 18px; left: 22px; display: flex; align-items: baseline; gap: 10px; font: 600 10.5px/1 var(--sans); letter-spacing: 0.32em; text-transform: uppercase; color: var(--dim); }
    #crumb button { all: unset; cursor: pointer; color: var(--dim); transition: color 0.2s; }
    #crumb button:hover { color: var(--ink); }
    #crumb .sep { opacity: 0.4; letter-spacing: 0; }
    #crumb .here { color: var(--ink); }
    #status { top: 18px; right: 22px; font-size: 11px; color: var(--faint); letter-spacing: 0.02em; transition: opacity 0.4s; }

    /* One label under each sculpture. */
    .label { position: absolute; transform: translate(-50%, 0); text-align: center; pointer-events: none; white-space: nowrap; transition: opacity 0.5s var(--ease); }
    .label .name { font: 600 10.5px/1 var(--sans); letter-spacing: 0.34em; text-transform: uppercase; color: var(--ink); opacity: 0.86; padding-left: 0.34em; }
    .label .count { font: 300 30px/1 var(--serif); color: var(--ink); margin-top: 9px; font-variant-numeric: lining-nums; }
    .label .note { font-size: 11px; color: var(--faint); margin-top: 7px; }
    .label.hot .name { opacity: 1; color: var(--gold); }
    .label.dim { opacity: 0.18; }
    .label.gone { opacity: 0; }

    /* The book under the pointer. */
    #tip { position: absolute; pointer-events: none; padding: 7px 11px 8px; border-radius: 10px; background: rgba(16,14,12,0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); opacity: 0; transform: translate(14px, 10px); transition: opacity 0.18s; max-width: 280px; }
    #tip.on { opacity: 1; }
    #tip .t { font: 400 14px/1.25 var(--serif); }
    #tip .a { font-size: 11px; color: var(--dim); margin-top: 2px; }

    #hint { left: 50%; bottom: 20px; transform: translateX(-50%); font-size: 11.5px; color: var(--faint); letter-spacing: 0.02em; white-space: nowrap; transition: opacity 0.5s; pointer-events: none; }
    #hint kbd { font: 600 10px/1 var(--sans); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; margin: 0 2px; color: var(--dim); }

    /* Inspection: a quiet panel on the right, a return control on the left. */
    #return { top: 50%; left: 22px; transform: translate(-8px, -50%); opacity: 0; pointer-events: none; transition: opacity 0.5s var(--ease), transform 0.5s var(--ease); }
    body.inspect #return { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }
    #return button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 12px; letter-spacing: 0.02em; padding: 10px 14px 10px 10px; border-radius: 22px; transition: background 0.2s, color 0.2s; }
    #return button { background: rgba(16,14,12,0.6); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); }
    #return button:hover { background: rgba(40,36,32,0.75); color: var(--ink); }
    body.inspect #hint { left: calc((100% - min(380px, 34vw)) / 2); white-space: normal; text-align: center; width: max-content; max-width: calc(100% - min(380px, 34vw) - 40px); }
    #return svg { width: 18px; height: 18px; }
    #panel { top: 0; right: 0; bottom: 0; width: min(380px, 34vw); padding: 64px 34px 30px 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 0; opacity: 0; transform: translateX(26px); pointer-events: none; transition: opacity 0.6s var(--ease), transform 0.6s var(--ease); background: rgba(14,13,12,0.62); backdrop-filter: blur(22px) saturate(1.1); -webkit-backdrop-filter: blur(22px) saturate(1.1); border-left: 1px solid rgba(241,235,224,0.06); }
    body.inspect #panel { opacity: 1; transform: none; pointer-events: auto; }
    #panel .status { font: 600 10px/1 var(--sans); letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); }
    #panel h1 { font: 400 27px/1.18 var(--serif); margin: 14px 0 0; letter-spacing: -0.005em; }
    #panel .sub { font: italic 400 15px/1.3 var(--serif); color: var(--dim); margin-top: 6px; }
    #panel .by { font-size: 13px; color: var(--ink); margin-top: 12px; }
    #panel .facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; margin: 22px 0 0; font-size: 12px; }
    #panel .facts dt { color: var(--faint); }
    #panel .facts dd { margin: 0; color: var(--ink); }
    .stars { letter-spacing: 2px; color: var(--gold); }
    .stars i { font-style: normal; color: rgba(241,235,224,0.18); }
    #panel .desc { margin-top: 22px; font: 400 13.5px/1.6 var(--serif); color: rgba(241,235,224,0.8); overflow-y: auto; flex: 1; min-height: 60px; padding-right: 8px; mask-image: linear-gradient(180deg, #000 85%, transparent); -webkit-mask-image: linear-gradient(180deg, #000 85%, transparent); white-space: pre-line; user-select: text; -webkit-user-select: text; }
    #panel .desc::-webkit-scrollbar { width: 4px; } #panel .desc::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
    #panel .row { display: flex; align-items: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    #panel .views { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: rgba(241,235,224,0.06); }
    #panel .views button, #panel .fav, #panel .link { all: unset; cursor: pointer; font-size: 11.5px; color: var(--dim); padding: 6px 9px; border-radius: 7px; transition: background 0.15s, color 0.15s; }
    #panel .views button:hover, #panel .link:hover { color: var(--ink); background: rgba(241,235,224,0.08); }
    #panel .fav { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); padding: 7px 12px; border-radius: 18px; color: var(--ink); }
    #panel .fav:hover { background: rgba(241,235,224,0.08); }
    #panel .fav svg { width: 13px; height: 13px; }
    #panel .fav.on { color: var(--gold); border-color: rgba(217,191,140,0.45); }
    #panel .fav.on path { fill: currentColor; }
    #panel .note { margin-top: 16px; font-size: 10.5px; line-height: 1.5; color: var(--faint); }
    #panel .cover { display: flex; gap: 14px; align-items: flex-end; margin-top: 20px; }
    #panel .cover img { width: 52px; border-radius: 2px; box-shadow: 0 6px 16px rgba(0,0,0,0.45); }
    #panel .cover .c { font-size: 10.5px; color: var(--faint); line-height: 1.45; }

    /* Holding to carry the book back: a ring fills around the pointer. */
    #hold { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
    #hold.on { opacity: 1; }
    #hold circle { fill: none; stroke: var(--gold); stroke-width: 2; stroke-dasharray: 126; stroke-dashoffset: 126; transform: rotate(-90deg); transform-origin: 50% 50%; }
    #hold.on circle { transition: stroke-dashoffset 0.38s linear; stroke-dashoffset: 0; }

    #toast { left: 50%; top: 18px; transform: translate(-50%, -12px); padding: 9px 15px; border-radius: 18px; background: rgba(20,18,16,0.82); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 12px; opacity: 0; transition: opacity 0.35s, transform 0.35s var(--ease); pointer-events: none; max-width: 70vw; text-align: center; }
    #toast.on { opacity: 1; transform: translate(-50%, 0); }
    #toast.err { color: #f2b8a8; }

    #empty { left: 50%; bottom: 64px; transform: translateX(-50%); text-align: center; max-width: 520px; font-size: 12.5px; line-height: 1.6; color: var(--dim); opacity: 0; transition: opacity 0.4s; pointer-events: none; }
    #empty.on { opacity: 1; pointer-events: auto; }
    #empty button { all: unset; cursor: pointer; color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 6px 13px; margin-top: 10px; font-size: 12px; }
    #empty button:hover { background: rgba(241,235,224,0.08); }

    /* Favorites: a button that floats up into view on a soft, angelic glow. */
    #favdock { right: 22px; bottom: 18px; }
    #favbtn { all: unset; pointer-events: auto; position: relative; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px 9px 13px; border-radius: 22px;
      font: 600 10.5px/1 var(--sans); letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink);
      background: linear-gradient(180deg, rgba(40,34,26,0.62), rgba(20,17,13,0.72)); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border: 1px solid rgba(217,191,140,0.32);
      box-shadow: 0 0 0 1px rgba(255,236,200,0.04) inset, 0 8px 22px rgba(0,0,0,0.35), 0 0 18px rgba(255,214,150,0.10), 0 10px 40px rgba(255,200,120,0.08);
      opacity: 0; transform: translateY(20px);
      animation: levitate 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards, bob 5.5s ease-in-out 1.9s infinite;
      transition: border-color 0.3s, box-shadow 0.5s var(--ease), color 0.3s; will-change: transform, opacity; }
    #favbtn svg { width: 13px; height: 13px; color: var(--gold); position: relative; z-index: 1; }
    #favbtn .l, #favbtn .n { position: relative; z-index: 1; }
    #favbtn .n { font: 300 15px/1 var(--serif); letter-spacing: 0; color: var(--gold); text-transform: none; }
    #favbtn .n:empty { display: none; }
    #favbtn:hover { border-color: rgba(217,191,140,0.6); box-shadow: 0 0 0 1px rgba(255,236,200,0.06) inset, 0 8px 22px rgba(0,0,0,0.35), 0 0 26px rgba(255,214,150,0.22), 0 12px 50px rgba(255,200,120,0.14); }
    #favbtn.on { color: #fff6e6; border-color: rgba(255,222,170,0.7); box-shadow: 0 0 0 1px rgba(255,236,200,0.1) inset, 0 8px 22px rgba(0,0,0,0.3), 0 0 30px rgba(255,214,150,0.35), 0 14px 60px rgba(255,200,120,0.22); }
    #favbtn.on path { fill: currentColor; }
    /* The aura behind and below, and rays of light rising from beneath. */
    #favbtn::before { content: ''; position: absolute; left: 50%; top: 62%; width: 240%; height: 300%; transform: translate(-50%, -50%); pointer-events: none; z-index: -1;
      background: radial-gradient(closest-side, rgba(255,226,170,0.30), rgba(255,206,140,0.12) 45%, transparent 75%);
      filter: blur(6px); opacity: 0; animation: aura 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards, breathe 5.5s ease-in-out 2.2s infinite; }
    #favbtn::after { content: ''; position: absolute; left: 8%; right: 8%; bottom: 40%; height: 260%; pointer-events: none; z-index: -1;
      background: repeating-linear-gradient(90deg, transparent 0 7px, rgba(255,232,190,0.22) 8px, transparent 10px 15px, rgba(255,240,210,0.14) 16px, transparent 18px 26px);
      -webkit-mask-image: linear-gradient(0deg, transparent, #000 25%, rgba(0,0,0,0.5) 60%, transparent); mask-image: linear-gradient(0deg, transparent, #000 25%, rgba(0,0,0,0.5) 60%, transparent);
      filter: blur(1.5px); opacity: 0; transform: translateY(12px) scaleY(0.6); transform-origin: 50% 100%;
      animation: rays 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards, shimmer 3.2s ease-in-out 2.5s infinite; }
    #favbtn.on::before { animation: none; opacity: 1; background: radial-gradient(closest-side, rgba(255,230,180,0.45), rgba(255,206,140,0.18) 45%, transparent 75%); }
    @keyframes levitate { to { opacity: 1; transform: translateY(0); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes aura { to { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
    @keyframes rays { to { opacity: 0.9; transform: translateY(0) scaleY(1); } }
    @keyframes shimmer { 0%, 100% { opacity: 0.9; transform: translateY(0) scaleY(1); } 50% { opacity: 0.55; transform: translateY(-4px) scaleY(1.06); } }
    @media (prefers-reduced-motion: reduce) { #favbtn, #favbtn::before, #favbtn::after { animation: none; opacity: 1; transform: none; } }
    /* While the favorites are up, their name floats in above them the same way. */
    #favtitle { left: 50%; top: 58px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; text-align: center; transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      font: 600 10.5px/1 var(--sans); letter-spacing: 0.42em; text-transform: uppercase; color: var(--gold); text-shadow: 0 0 18px rgba(255,214,150,0.55), 0 0 40px rgba(255,200,120,0.25); }
    body.favorites #favtitle { opacity: 1; transform: translate(-50%, 0); transition-delay: 0.35s; }
    body.favorites .label { opacity: 0.12; }
    #drop { position: absolute; inset: 14px; border-radius: 18px; border: 1.5px dashed rgba(217,191,140,0.6); background: rgba(13,12,11,0.55); display: grid; place-items: center; font: 400 20px/1.4 var(--serif); color: var(--ink); opacity: 0; pointer-events: none; transition: opacity 0.2s; text-align: center; }
    #drop small { display: block; font: 12px/1.5 var(--sans); color: var(--dim); margin-top: 6px; }
    body.dropping #drop { opacity: 1; }
  </style>
</head>
<body class="grab">
  <canvas id="c"></canvas>
  <div id="vignette"></div>
  <div id="labels"></div>
  <div class="ui" id="crumb"><button id="home">Library</button></div>
  <div class="ui" id="status"></div>
  <div id="tip"><div class="t"></div><div class="a"></div></div>
  <div class="ui" id="hint"></div>
  <div class="ui" id="return"><button id="back" title="Put it back (Esc)"><svg viewBox="0 0 18 18"><path d="M11.5 4 6.5 9l5 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Put it back</span></button></div>
  <div class="ui" id="panel"></div>
  <svg id="hold" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20"/></svg>
  <div class="ui" id="favdock"><button id="favbtn" aria-pressed="false" title="Lift your favorites out of their sculptures"><svg viewBox="0 0 16 16"><path d="M8 13.6S2.2 10.2 2.2 6.1A2.9 2.9 0 0 1 8 4.7a2.9 2.9 0 0 1 5.8 1.4C13.8 10.2 8 13.6 8 13.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span class="l">Favorites</span><span class="n"></span></button></div>
  <div class="ui" id="favtitle">Favorites</div>
  <div class="ui" id="toast"></div>
  <div class="ui" id="empty"></div>
  <div id="drop"><div>Drop it into the Library<small>A Goodreads export (.csv)</small></div></div>
  <script type="module" src="library.js"></script>
</body>
</html>
