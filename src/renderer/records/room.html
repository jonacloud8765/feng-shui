<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://w.soundcloud.com; frame-src https://w.soundcloud.com; img-src 'self' data: blob: https://*.sndcdn.com; connect-src 'self' file: blob: data: https://*.sndcdn.com; style-src 'self' 'unsafe-inline'">
  <title>Record Room</title>
  <style>
    :root { color-scheme: light dark; --ink: #f4ede2; --dim: rgba(244,237,226,0.62); --pane: rgba(18,15,14,0.52); --line: rgba(255,240,220,0.14); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a0d; font: 13px/1.35 -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    .hud { position: absolute; pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .glass { background: var(--pane); border: 1px solid var(--line); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    #top { top: 12px; right: 12px; display: flex; gap: 8px; }
    .seg { display: flex; padding: 3px; gap: 2px; border-radius: 11px; }
    .seg button, .btn { appearance: none; border: 0; background: transparent; color: var(--dim); font: 600 12px/1 inherit; font-family: inherit; padding: 7px 11px; border-radius: 8px; cursor: pointer; }
    .seg button.on { background: rgba(255,240,220,0.16); color: var(--ink); }
    .btn { color: var(--ink); padding: 8px 12px; border-radius: 11px; }
    .btn:hover, .seg button:hover { color: var(--ink); }
    #back { display: none; }
    body.crate #back { display: block; }
    #title { top: 14px; left: 16px; font: 700 11px/1 inherit; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); pointer-events: none; }
    #hint { left: 50%; bottom: 76px; transform: translateX(-50%); padding: 7px 13px; border-radius: 20px; color: var(--dim); font-size: 12px; white-space: nowrap; transition: opacity 0.4s; pointer-events: none; }
    #now { left: 12px; bottom: 12px; display: flex; align-items: center; gap: 12px; padding: 9px 12px 9px 9px; width: 340px; max-width: calc(100vw - 24px); box-sizing: border-box; border-radius: 18px; transition: opacity 0.4s, transform 0.4s; }
    #now.idle { opacity: 0; transform: translateY(12px); pointer-events: none; }
    #now img { width: 78px; height: 78px; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.45); object-fit: cover; background: #222; flex: none; }
    #now .ctl { display: flex; align-items: center; gap: 5px; margin-top: 7px; }
    #now .ctl button { width: 28px; height: 28px; }
    #now .ctl button.big { width: 32px; height: 32px; background: rgba(255,240,220,0.18); }
    #now .ctl input { flex: 1; min-width: 40px; }
    #now .tm { color: var(--dim); font-size: 10.5px; font-variant-numeric: tabular-nums; margin-top: 3px; display: flex; justify-content: space-between; }
    #now .bar { cursor: pointer; height: 4px !important; }
    input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: rgba(255,240,220,0.18); outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
    #now .meta { flex: 1; min-width: 0; }
    #now .t { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #now .a { color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    #now .a:hover { text-decoration: underline; }
    #now .bar { height: 3px; border-radius: 2px; background: rgba(255,240,220,0.14); margin-top: 6px; overflow: hidden; }
    #now .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb35c, #ff5fa2, #8a7dff); }
    #now button { appearance: none; border: 0; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,240,220,0.1); color: var(--ink); cursor: pointer; display: grid; place-items: center; flex: none; }
    #now button:hover { background: rgba(255,240,220,0.2); }
    #now svg { width: 13px; height: 13px; fill: currentColor; }
    kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 6px; background: rgba(255,240,220,0.9); color: #1a1310; font: 700 11px/1 inherit; font-family: inherit; }
    /* Interaction prompt, context menu, seated controls: bottom centre, small. */
    #prompt { left: 50%; bottom: 18px; transform: translateX(-50%); display: none; align-items: center; gap: 9px; padding: 7px 14px 7px 8px; border-radius: 22px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.15s; }
    #prompt:hover { background: rgba(40,30,26,0.72); }
    #prompt.on { display: flex; }
    #menu, #seat { left: 50%; bottom: 18px; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 8px; padding: 10px; border-radius: 18px; }
    #menu.on, #seat.on { display: flex; }
    #menu .h, #seat .h { color: var(--dim); font-size: 11.5px; letter-spacing: 0.02em; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .act { appearance: none; border: 0; border-radius: 11px; padding: 9px 14px; font: 600 12.5px/1 inherit; font-family: inherit; color: var(--ink); background: rgba(255,240,220,0.12); cursor: pointer; transition: background 0.12s, transform 0.12s; }
    .act:hover, .act.focus { background: rgba(255,240,220,0.26); }
    .act:active { transform: scale(0.97); }
    .act.go { background: linear-gradient(90deg, #ff9d4d, #ff5fa2); color: #1a1010; }
    .act.go:hover, .act.go.focus { filter: brightness(1.08); box-shadow: 0 0 0 2px rgba(255,240,220,0.5); }
    .act:disabled { opacity: 0.4; cursor: default; }
    #menu .vol { display: flex; align-items: center; gap: 10px; width: 260px; font-size: 12px; color: var(--dim); }
    #menu .vol input { flex: 1; }
    #seat .clock { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 650; }
    /* Record browser: the crate's records as a simple list on the right. */
    #browser { top: 54px; right: 12px; bottom: 12px; width: 300px; display: none; flex-direction: column; padding: 10px 8px 8px; }
    body.crate #browser { display: flex; }
    body.crate #queue { display: none !important; }
    #browser .tabs { display: flex; gap: 4px; margin: 0 4px 8px; }
    #browser .tabs button { flex: 1; appearance: none; border: 0; border-radius: 9px; padding: 7px 4px; font: 600 11.5px/1.1 inherit; font-family: inherit; color: var(--dim); background: transparent; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #browser .tabs button.on { background: rgba(255,240,220,0.16); color: var(--ink); }
    #browser ol { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
    #browser li { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 11px; cursor: pointer; }
    #browser li:hover { background: rgba(255,240,220,0.08); }
    #browser li.sel { background: rgba(255,240,220,0.18); box-shadow: inset 0 0 0 1px rgba(255,200,150,0.35); }
    #browser li.out { opacity: 0.45; }
    #browser li img { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; background: #222; flex: none; }
    #browser li .m { flex: 1; min-width: 0; }
    #browser li .t { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #browser li .a { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #browser .foot { display: flex; gap: 6px; padding: 8px 4px 2px; }
    #browser .foot .act { flex: 1; }
    /* Settings (Esc). */
    #settings { inset: 0; display: none; place-items: center; background: rgba(8,6,6,0.42); pointer-events: auto; }
    #settings.on { display: grid; }
    #settings .card { width: 340px; max-width: calc(100vw - 32px); padding: 18px 18px 14px; }
    #settings h2 { margin: 0 0 12px; font: 700 12px/1 inherit; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
    #settings label { display: grid; grid-template-columns: 130px 1fr 34px; align-items: center; gap: 10px; margin: 9px 0; font-size: 12.5px; }
    #settings label output { color: var(--dim); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
    #settings .seg button.on { background: rgba(255,240,220,0.2); color: var(--ink); }
    #settings .line { display: grid; grid-template-columns: 130px 1fr; align-items: center; gap: 10px; margin: 9px 0; font-size: 12.5px; }
    #settings .keys { margin-top: 12px; color: var(--dim); font-size: 11px; line-height: 1.6; }
    #settings .foot { display: flex; justify-content: flex-end; margin-top: 12px; }
    #tip { position: absolute; pointer-events: none; padding: 6px 10px; border-radius: 10px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -130%); opacity: 0; transition: opacity 0.15s; }
    #tip b { font-weight: 650; }
    #tip span { color: var(--dim); }
    #veil { position: absolute; inset: 0; display: grid; place-items: center; background: #0b0a0d; color: var(--dim); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; transition: opacity 0.9s; }
    #veil.gone { opacity: 0; pointer-events: none; }
    #sc { position: absolute; left: -2000px; top: 0; width: 320px; height: 166px; border: 0; opacity: 0; pointer-events: none; }
    #queue { top: 54px; right: 12px; width: 300px; max-height: calc(100% - 200px); display: none; flex-direction: column; padding: 10px 8px 8px; }
    body.q #queue { display: flex; }
    #queue h3 { margin: 0 6px 8px; font: 700 11px/1 inherit; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; }
    #queue h3 button { appearance: none; border: 0; background: none; color: var(--dim); font: 600 11px/1 inherit; cursor: pointer; letter-spacing: 0; text-transform: none; padding: 0; }
    #queue h3 button:hover { color: var(--ink); }
    #queue ol { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; }
    #queue li { display: flex; align-items: center; gap: 9px; padding: 5px 6px; border-radius: 10px; cursor: grab; }
    #queue li:hover { background: rgba(255,240,220,0.08); }
    #queue li.drop { box-shadow: inset 0 2px 0 #ffb35c; }
    #queue li.auto { opacity: 0.6; cursor: default; }
    #queue li img { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; background: #222; flex: none; pointer-events: none; }
    #queue li .m { flex: 1; min-width: 0; }
    #queue li .t { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #queue li .a { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #queue li button { appearance: none; border: 0; background: transparent; color: var(--dim); width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font: 13px/1 inherit; flex: none; opacity: 0; }
    #queue li:hover button { opacity: 1; }
    #queue li button:hover { background: rgba(255,240,220,0.14); color: var(--ink); }
    #queue .sep { margin: 10px 6px 4px; font-size: 11px; color: var(--dim); }
    #queue .empty { margin: 2px 6px 6px; font-size: 12px; color: var(--dim); }
    #qb b { display: inline-block; min-width: 16px; margin-left: 4px; padding: 2px 5px; border-radius: 8px; background: rgba(255,240,220,0.16); font-size: 11px; }
    body.q #qb { background: rgba(255,240,220,0.16); }
    #inspect { left: 50%; bottom: 18px; transform: translateX(-50%); display: none; align-items: center; gap: 14px; padding: 10px 12px 10px 10px; border-radius: 18px; max-width: min(640px, 92vw); }
    body.inspect #inspect { display: flex; }
    body.inspect #now { opacity: 0; pointer-events: none; }
    #inspect img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex: none; }
    #inspect .m { min-width: 0; flex: 1; }
    #inspect .t { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #inspect .a { color: var(--dim); font-size: 12px; }
    #inspect .row { display: flex; gap: 6px; flex: none; }
    #inspect button { appearance: none; border: 0; border-radius: 10px; padding: 8px 12px; font: 600 12px/1 inherit; font-family: inherit; color: var(--ink); background: rgba(255,240,220,0.12); cursor: pointer; }
    #inspect button:hover { background: rgba(255,240,220,0.22); }
    #inspect button.go { background: linear-gradient(90deg, #ff9d4d, #ff5fa2); color: #1a1010; }
    #err { top: 50px; right: 12px; max-width: 280px; padding: 10px 12px; font-size: 12px; display: none; }
  </style>
</head>
<body>
  <canvas id="c" tabindex="0"></canvas>
  <div class="hud" id="title">Record Room</div>
  <div class="hud" id="top">
    <button class="btn glass" id="back" title="Back to the room (Esc)">← Room</button>
    <button class="btn glass" id="qb" title="Show the queue (Q)">Queue<b>0</b></button>
    <div class="seg glass" id="views">
      <button data-v="third" class="on" title="Third person (F)">3rd person</button>
      <button data-v="first" title="First person (F)">1st person</button>
    </div>
  </div>
  <div class="hud glass" id="err"></div>
  <div class="hud glass" id="inspect"><img alt=""><div class="m"><div class="t"></div><div class="a"></div></div><div class="row"><button class="go" data-a="play" title="Put it on the turntable (Enter)">Play it</button><button data-a="queue" title="Line it up on the table (Q)">Queue</button><button data-a="back" title="Back in the shelf (Esc)">Put back</button></div></div>
  <div class="hud glass" id="queue"><h3><span>Up next</span><button id="qclear" title="Put every queued record back in its crate">Clear</button></h3><ol></ol></div>
  <div class="hud glass" id="hint">Click a crate to flip through it</div>
  <div class="hud glass idle" id="now">
    <img alt="">
    <div class="meta">
      <div class="t"></div><div class="a" title="Open on SoundCloud"></div>
      <div class="bar" id="seek" title="Click to jump"><i></i></div>
      <div class="tm"><span id="tpos">0:00</span><span id="tdur"></span></div>
      <div class="ctl">
        <button id="pv" title="Previous"><svg viewBox="0 0 16 16"><path d="M13 2.5v11l-7-5.5zM3 2.5h2v11H3z"/></svg></button>
        <button id="pp" class="big" title="Play / pause (Space)"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg></button>
        <button id="st" title="Stop"><svg viewBox="0 0 16 16"><path d="M3.5 3.5h9v9h-9z"/></svg></button>
        <button id="nx" title="Next record (N)"><svg viewBox="0 0 16 16"><path d="M3 2.5v11l7-5.5zM11 2.5h2v11h-2z"/></svg></button>
        <input type="range" id="vol" min="0" max="100" title="Volume">
      </div>
    </div>
  </div>
  <div class="hud glass" id="prompt"><kbd>E</kbd><span></span></div>
  <div class="hud glass" id="menu"></div>
  <div class="hud glass" id="seat"></div>
  <div class="hud glass" id="browser"><div class="tabs"></div><ol></ol><div class="foot"><button class="act go" id="bplay" title="Put it on the turntable (Enter)">Play record</button><button class="act" id="bqueue" title="Line it up on the table">Queue</button><button class="act" id="bclose" title="Close (Esc)">Close</button></div></div>
  <div class="hud" id="settings"><div class="card glass">
    <h2>Paused</h2>
    <label>Camera sensitivity<input type="range" data-k="camSens" min="0.3" max="2" step="0.05"><output></output></label>
    <label>Mouse sensitivity<input type="range" data-k="mouseSens" min="0.3" max="2" step="0.05"><output></output></label>
    <label>Walking speed<input type="range" data-k="walkSpeed" min="0.7" max="1.5" step="0.05"><output></output></label>
    <label>Music volume<input type="range" data-k="volume" min="0" max="100" step="1"><output></output></label>
    <label>Sound effects<input type="range" data-k="sfx" min="0" max="100" step="1"><output></output></label>
    <div class="line">Graphics<div class="seg glass" id="gq"><button data-q="low">Low</button><button data-q="medium">Medium</button><button data-q="high">High</button></div></div>
    <div class="line">Camera<div class="seg glass" id="gv"><button data-v="third">3rd person</button><button data-v="first">1st person</button></div></div>
    <div class="line">Display<div><button class="act" id="fs">Full screen</button></div></div>
    <div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows walk · <kbd>E</kbd> interact · <kbd>F</kbd> camera · drag to look · scroll to zoom · <kbd>Space</kbd> play/pause · <kbd>Q</kbd> queue · <kbd>Esc</kbd> menu</div>
    <div class="foot"><button class="act go" id="resume">Resume</button></div>
  </div></div>
  <div class="glass" id="tip"></div>
  <div id="veil">Warming up the room…</div>
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script type="module" src="room.js"></script>
</body>
</html>
