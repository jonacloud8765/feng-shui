<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://w.soundcloud.com; frame-src https://w.soundcloud.com; img-src 'self' data: blob: https://*.sndcdn.com; connect-src 'self' file: blob: data: https://*.sndcdn.com; style-src 'self' 'unsafe-inline'">
  <title>Record Room</title>
  <style>
    :root { color-scheme: light dark; --ink: #f4ede2; --dim: rgba(244,237,226,0.62); --pane: rgba(18,15,14,0.52); --line: rgba(255,240,220,0.14); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a0d; font: 13px/1.35 -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    .hud { position: absolute; pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .glass { background: var(--pane); border: 1px solid var(--line); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    #top { top: 12px; right: 12px; display: flex; gap: 8px; }
    .seg { display: flex; padding: 3px; gap: 2px; border-radius: 11px; }
    .seg button, .btn { appearance: none; border: 0; background: transparent; color: var(--dim); font: 600 12px/1 inherit; font-family: inherit; padding: 7px 11px; border-radius: 8px; cursor: pointer; }
    .seg button.on { background: rgba(255,240,220,0.16); color: var(--ink); }
    .btn { color: var(--ink); padding: 8px 12px; border-radius: 11px; }
    .btn:hover, .seg button:hover { color: var(--ink); }
    #back { display: none; }
    body.crate #back { display: block; }
    #title { top: 14px; left: 16px; font: 700 11px/1 inherit; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); pointer-events: none; }
    #hint { left: 50%; bottom: 84px; transform: translateX(-50%); padding: 7px 13px; border-radius: 20px; color: var(--dim); font-size: 12px; white-space: nowrap; transition: opacity 0.4s; pointer-events: none; }
    #now { left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 8px; min-width: 300px; max-width: min(560px, 86vw); border-radius: 16px; transition: opacity 0.4s, transform 0.4s; }
    #now.idle { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
    #now img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #222; flex: none; }
    #now .meta { flex: 1; min-width: 0; }
    #now .t { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #now .a { color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    #now .a:hover { text-decoration: underline; }
    #now .bar { height: 3px; border-radius: 2px; background: rgba(255,240,220,0.14); margin-top: 6px; overflow: hidden; }
    #now .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb35c, #ff5fa2, #8a7dff); }
    #now button { appearance: none; border: 0; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,240,220,0.1); color: var(--ink); cursor: pointer; display: grid; place-items: center; flex: none; }
    #now button:hover { background: rgba(255,240,220,0.2); }
    #now svg { width: 15px; height: 15px; fill: currentColor; }
    #tip { position: absolute; pointer-events: none; padding: 6px 10px; border-radius: 10px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -130%); opacity: 0; transition: opacity 0.15s; }
    #tip b { font-weight: 650; }
    #tip span { color: var(--dim); }
    #veil { position: absolute; inset: 0; display: grid; place-items: center; background: #0b0a0d; color: var(--dim); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; transition: opacity 0.9s; }
    #veil.gone { opacity: 0; pointer-events: none; }
    #sc { position: absolute; left: -2000px; top: 0; width: 320px; height: 166px; border: 0; opacity: 0; pointer-events: none; }
    #err { top: 50px; right: 12px; max-width: 280px; padding: 10px 12px; font-size: 12px; display: none; }
  </style>
</head>
<body>
  <canvas id="c" tabindex="0"></canvas>
  <div class="hud" id="title">Record Room</div>
  <div class="hud" id="top">
    <button class="btn glass" id="back" title="Back to the room (Esc)">← Room</button>
    <div class="seg glass" id="views">
      <button data-v="third" class="on" title="From the couch (V)">3rd person</button>
      <button data-v="first" title="First person (V)">1st person</button>
    </div>
  </div>
  <div class="hud glass" id="err"></div>
  <div class="hud glass" id="hint">Click a crate to flip through it</div>
  <div class="hud glass idle" id="now">
    <img alt="">
    <div class="meta"><div class="t"></div><div class="a" title="Open on SoundCloud"></div><div class="bar"><i></i></div></div>
    <button id="pp" title="Play / pause (Space)"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg></button>
    <button id="nx" title="Next record (N)"><svg viewBox="0 0 16 16"><path d="M3 2.5v11l7-5.5zM11 2.5h2v11h-2z"/></svg></button>
  </div>
  <div class="glass" id="tip"></div>
  <div id="veil">Warming up the room…</div>
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script type="module" src="room.js"></script>
</body>
</html>
