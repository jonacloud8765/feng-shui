<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Layouts</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
      font: 500 11.5px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: rgba(255,255,255,0.92); }
    /* Liquid glass: the native blur sits behind; this adds the lens edge and sheen. */
    .bar { position: absolute; inset: 0; border-radius: 999px; display: flex; align-items: center; gap: 2px; padding: 0 4px; box-sizing: border-box;
      background: linear-gradient(180deg, rgba(255,255,255,0.20), rgba(255,255,255,0.06) 55%, rgba(255,255,255,0.10));
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.65), inset 0 -0.5px 0 rgba(255,255,255,0.18), inset 0 0 0 0.5px rgba(255,255,255,0.22); }
    .seg { flex: none; height: 26px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px 0 8px; border: 0; border-radius: 999px; background: transparent;
      color: inherit; font: inherit; white-space: nowrap; cursor: default; opacity: 0.78; transition: background .18s ease, opacity .18s ease, box-shadow .18s ease; }
    .seg:hover { opacity: 1; background: rgba(255,255,255,0.10); }
    .seg.on { opacity: 1; background: rgba(255,255,255,0.26); box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.7), 0 1px 4px rgba(0,0,0,0.18); }
    .seg svg { width: 13px; height: 13px; flex: none; }
    .sep { width: 0.5px; height: 16px; background: rgba(255,255,255,0.3); margin: 0 3px; }
    .icon { width: 26px; padding: 0; justify-content: center; }
    input { height: 22px; width: 150px; border: 0; border-radius: 999px; padding: 0 10px; outline: none; font: inherit; color: #fff;
      background: rgba(0,0,0,0.22); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.35); }
    input::placeholder { color: rgba(255,255,255,0.55); }
    .note { padding: 0 8px; opacity: 0.85; white-space: nowrap; }
    /* Keyboard switching: a soft ring says the bar is listening. */
    body.keys .bar { box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.65), inset 0 0 0 1.5px rgba(255,255,255,0.55); }
    body.fs.keys .bar { box-shadow: inset 0 0 0 1px #c9a227, inset 1px 1px 0 2px #fff, inset -1px -1px 0 2px #808080; }
    .note.keys { opacity: 0.7; font-size: 10.5px; }
    /* Feng Shui layout: a Windows 95 strip in gray lacquer, the active tab in red with a gold rim. */
    body.fs { color: #1a1a18; font: 700 11px/1 Verdana, Geneva, Tahoma, sans-serif; }
    body.fs .bar { border-radius: 0; background: #c0c0c0; border: 1px solid #000; gap: 3px; padding: 0 3px;
      box-shadow: inset 1px 1px 0 #fff, inset 2px 2px 0 #dfdfdf, inset -1px -1px 0 #000, inset -2px -2px 0 #808080; }
    body.fs .seg { border-radius: 0; height: 24px; opacity: 1; background: #c0c0c0; padding: 0 8px 0 6px;
      box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #000, inset -2px -2px 0 #808080; }
    body.fs .seg:hover { background: #cacaca; }
    body.fs .seg.on { color: #f5e6c8; background: linear-gradient(180deg, #c41e3a, #9b1b30); text-shadow: 0 1px 0 rgba(0,0,0,.35);
      box-shadow: inset 1px 1px 0 #000, inset 2px 2px 0 #5e0d1b, inset -1px -1px 0 #c9a227; }
    body.fs .seg .han { font: 700 12px/1 "Songti SC", "STSong", "PingFang SC", serif; }
    body.fs .sep { width: 1px; background: #808080; box-shadow: 1px 0 0 #fff; }
    body.fs input { border-radius: 0; background: #fff; color: #1a1a18; box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #fff; }
    body.fs input::placeholder { color: #808080; }
  </style>
</head>
<body>
  <div class="bar" id="bar"></div>
  <script src="bar.js"></script>
</body>
</html>
