<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'">
  <title>About</title>
  <style>
    :root { --paper: #f4efe4; --paper-2: #e9e1d0; --ink: #1a1a18; --soft: #6b655a; --line: #d8cfbc; --gold: #c9a227; --red: #b3202f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
    body { background: linear-gradient(180deg, var(--paper), var(--paper-2)); color: var(--ink);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; text-align: center; padding: 46px 34px 22px; -webkit-app-region: drag; }
    img.mark { width: 108px; height: 108px; margin-bottom: 14px; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.12)); }
    h1 { margin: 0; font: 600 26px/1.1 "Iowan Old Style", "Palatino", Georgia, serif; letter-spacing: 0.01em; }
    .ver { margin-top: 8px; color: var(--soft); font-size: 11.5px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
    .rule { width: 56px; height: 1px; background: var(--gold); margin: 18px auto 16px; position: relative; }
    .rule::after { content: ''; position: absolute; left: 50%; top: -3px; width: 7px; height: 7px; margin-left: -3.5px; background: var(--red); transform: rotate(45deg); }
    p { margin: 0 0 12px; max-width: 330px; color: #3a372f; }
    ul { list-style: none; padding: 0; margin: 0 0 18px; color: #3a372f; font-size: 12px; display: grid; gap: 3px; }
    .links { display: flex; gap: 8px; -webkit-app-region: no-drag; }
    button { font: inherit; font-size: 12px; color: var(--ink); background: rgba(255,255,255,0.55); border: 1px solid var(--line); border-radius: 7px; padding: 5px 12px; }
    button:hover { background: #fff; }
    button:active { transform: translateY(1px); }
    footer { margin-top: auto; color: var(--soft); font-size: 11px; line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #1d1d1b; --paper-2: #141413; --ink: #efe9dc; --soft: #a49d8e; --line: #3a3833; }
      p, ul { color: #d6cfbf; }
      button { background: rgba(255,255,255,0.06); }
      button:hover { background: rgba(255,255,255,0.12); }
    }
  </style>
</head>
<body>
  <img class="mark" src="brand/mark.svg" alt="">
  <h1 id="name"></h1>
  <div class="ver" id="ver"></div>
  <div class="rule"></div>
  <p id="tagline"></p>
  <ul>
    <li>Widgets that sit on your wallpaper, below your apps</li>
    <li>Layouts you can switch with a click or the arrow keys</li>
    <li>Feng Shui: one command to bring the desk into balance</li>
  </ul>
  <div class="links">
    <button id="repo">Source on GitHub</button>
    <button id="close">Close</button>
  </div>
  <footer id="foot"></footer>
  <script src="about.js"></script>
</body>
</html>
