<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
  <title>Feng Shui wallpaper</title>
  <style>
    /* A living yin yang on warm paper (wallpaper.js). Flat, two-dimensional,
       drawn fresh every frame; the widgets float on light glass around it. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #eeebe4; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="paper"></canvas>
  <canvas id="ink"></canvas>
  <script src="wallpaper.js"></script>
</body>
</html>
