<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
  <title>Feng Shui wallpaper</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e6dc; }
    body { background: url("wallpaper.jpg") center / cover no-repeat; }
    /* Kept low in contrast: the room is calm, the widgets are the furniture. */
    body::after { content: ''; position: fixed; inset: 0; background: rgba(236, 232, 220, 0.18); }
  </style>
</head>
<body></body>
</html>
