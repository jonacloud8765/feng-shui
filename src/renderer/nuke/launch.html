<script>
(function(){
var root=document.getElementById('root'),R=document.documentElement.style,fr=root.querySelectorAll('.frame'),$=function(id){return document.getElementById(id)},i=0,ac=null,last=0,lock=false,timer=null,N=17,bar=$('sbarx'),segs=[],main=$('main');
for(var k=0;k<N;k++){var e=document.createElement('i');bar.appendChild(e);segs.push(e);}
function fit(){var W=root.clientWidth,H=root.clientHeight,u=Math.min(W/400,H/440);R.setProperty('--u',u.toFixed(4));var b=Math.max(1,Math.round(u));R.setProperty('--b',b+'px');R.setProperty('--b2',2*b+'px');}
function tone(f,d,end,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='square';o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05);}catch(e){}}
function beep(){if(fr[i].id==='done')tone(90,.5,30);else tone(fr[i].classList.contains('busy')?520+i*40:880,.08);}
function status(a,b){$('s1').textContent=a;$('s2').textContent=b;}
function show(){for(var k=0;k<fr.length;k++)fr[k].classList.toggle('on',k===i);var f=fr[i],t=f.getAttribute('data-t'),s=(f.getAttribute('data-s')||'|').split('|');$('ttl').textContent=t;$('tname').textContent=t;status(s[0],s[1]);$('clock').textContent='0'+(i+1)+'/0'+fr.length;document.body.classList.toggle('busy',f.classList.contains('busy'));var d=f.querySelector('[data-focus]');if(d)d.focus({preventScroll:true});else if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 if(f.id==='launch')run();if(f.id==='pressed'){lock=true;setTimeout(function(){lock=false;go(true);},900);}}
function run(){lock=true;var n=0;segs.forEach(function(s){s.classList.remove('f');});clearInterval(timer);timer=setInterval(function(){segs[n].classList.add('f');n++;tone(300+n*25,.03,0,.03);if(n>=N){clearInterval(timer);setTimeout(function(){lock=false;go(true);},800);}},200);}
function go(force){if(!force){if(lock)return;var n=Date.now();if(n-last<120)return;last=n;}if(i>=fr.length-1)return;i++;show();beep();}
function shake(){main.classList.remove('shake');void main.offsetWidth;main.classList.add('shake');tone(140,.12);}
root.addEventListener('click',function(e){var b=e.target.closest('button');if(b){e.stopPropagation();var a=b.getAttribute('data-act');
 if(a==='launch'||a==='go')go();
 else if(a==='cancel'){shake();status('Cancel is not an option.','61%');}
 else if(a==='shake'){shake();if(fr[i].id!=='done')status('Nice try.',fr[i].getAttribute('data-s').split('|')[1]);}
 else if(a==='ok'){tone(660,.06);}
 else tone(880,.04);
 return;}
